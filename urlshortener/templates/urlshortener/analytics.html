<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | SnapLink</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; }
        .navbar { background-color: #1a73e8; padding: 15px 0; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; border-bottom: 2px solid #1a73e8; display: inline-block; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #555; }
        .badge { background: #e1f5fe; padding: 5px 12px; border-radius: 20px; font-size: 13px; color: #01579b; font-weight: bold; }
        .btn-back { text-decoration: none; background: #333; color: white; padding: 8px 15px; border-radius: 5px; font-size: 14px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin-left: 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="max-width: 900px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
            <span style="font-size: 24px;">SnapLink 🔗</span>
            <div>
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'analytics' %}">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Link Performance Dashboard</h2>
            <table>
                <thead>
                    <tr>
                        <th>Short Link</th>
                        <th>Original URL</th>
                        <th>Clicks</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in all_urls %}
                    <tr>
                        <td style="color: #1a73e8; font-weight: bold;">{{ request.get_host }}/{{ item.short_code }}</td>
                        <td style="color: #666; font-size: 13px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ item.original_url }}</td>
                        <td><span class="badge">{{ item.clicks }} clicks</span></td>
                        <td style="color: #999; font-size: 12px;">{{ item.created_at|date:"M d, Y" }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" style="text-align: center; color: #999;">No links generated yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
